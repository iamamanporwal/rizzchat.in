<script>
(function(){
  var C = window.DOMAIN_CONFIG, $ = function(id){return document.getElementById(id)};
  $('dName').textContent = C.name; $('dTld').textContent = C.tld;
  $('price').textContent = C.price; $('email').textContent = C.email;
  $('pill').href = 'mailto:' + C.email + '?subject=' + encodeURIComponent('Interested in ' + C.name + C.tld);
  $('tagline').textContent = C.tagline;
  document.title = C.name + C.tld + ' is for sale';

  var q = new URLSearchParams(location.search);
  if (q.has('still')) document.documentElement.classList.add('still');

  var card = $('card'), stage = $('stage');
  function fit(el, max){ el.style.transform = el.style.transform || ''; var w = el.scrollWidth; return w > max ? max / w : 1; }
  function layout(){
    stage.style.setProperty('--s', card.clientWidth / 1672);
    var d = $('domain'); d.style.fontSize = ''; var k = fit(d, 790); if (k < 1) d.style.fontSize = (198 * k) + 'px';
    var p = $('price'); p.style.fontSize = ''; var kp = fit(p, 440); if (kp < 1) p.style.fontSize = (134 * kp) + 'px';
    var e = $('email'); var pill = $('pill'); pill.style.fontSize = ''; if (e.scrollWidth > 470) pill.style.fontSize = (28.6 * 470 / e.scrollWidth) + 'px';
  }
  new ResizeObserver(layout).observe(card);
  (document.fonts && document.fonts.ready || Promise.resolve()).then(layout);

  // 3D tilt: follows the pointer, drifts gently on its own when idle (and on touch screens)
  var root = document.documentElement;
  if (!q.has('still') && !matchMedia('(prefers-reduced-motion:reduce)').matches){
    var tx = 0, ty = 0, cx = 0, cy = 0, last = -1e9, t0 = performance.now();
    var MAXY = 11, MAXX = 8;   // max tilt in degrees
    function onMove(ev){
      var r = card.getBoundingClientRect();
      tx = Math.max(-1, Math.min(1, ((ev.clientX - r.left) / r.width - .5) * 2));
      ty = Math.max(-1, Math.min(1, ((ev.clientY - r.top) / r.height - .5) * 2));
      card.style.setProperty('--mx', ((tx + 1) * 50) + '%'); card.style.setProperty('--my', ((ty + 1) * 50) + '%');
      last = performance.now();
    }
    window.addEventListener('pointermove', onMove, {passive:true});
    window.addEventListener('deviceorientation', function(e){
      if (e.gamma == null) return;
      tx = Math.max(-1, Math.min(1, e.gamma / 25)); ty = Math.max(-1, Math.min(1, (e.beta - 45) / 25)); last = performance.now();
    }, {passive:true});
    (function tick(now){
      if (now - last > 1800){ var t = (now - t0) / 1000; tx = Math.sin(t * .55) * .55; ty = Math.cos(t * .42) * .4; }
      cx += (tx - cx) * .06; cy += (ty - cy) * .06;
      card.style.transform = 'rotateY(' + (cx * MAXY).toFixed(3) + 'deg) rotateX(' + (-cy * MAXX).toFixed(3) + 'deg)';
      root.style.setProperty('--px', cx.toFixed(4)); root.style.setProperty('--py', cy.toFixed(4));
      requestAnimationFrame(tick);
    })(t0);
  }
})();
</script>
